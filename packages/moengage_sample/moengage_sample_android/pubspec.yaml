name: moengage_sample_android
description: Android implementation of the moengage_sample plugin
version: 0.1.0
homepage: https://moengage.com

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.44.0"

resolution: workspace
flutter:
  plugin:
    implements: moengage_sample
    platforms:
      android:
        package: com.moengage.flutter.sample
        pluginClass: MoEngageSamplePlugin
        dartPluginClass: MoEngageSampleAndroid

dependencies:
  flutter:
    sdk: flutter
  moengage_flutter: ^10.0.0
  moengage_sample_platform_interface: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  plugin_platform_interface: ^2.0.0
