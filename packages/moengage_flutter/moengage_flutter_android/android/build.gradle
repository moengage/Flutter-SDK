group 'com.moengage.flutter'
version '1.0'

buildscript {
    ext.kotlin_version = '2.3.20'
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }

    dependencies {
        classpath "com.android.tools.build:gradle:9.1.1"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "com.moengage.android.hybrid.module.config.plugin:com.moengage.android.hybrid.module.config.plugin.gradle.plugin:2.0.0"
    }
}

// gradle-config-plugin 2.0.0 dropped its own org.jetbrains.kotlin.android apply
// in favor of AGP 9's built-in Kotlin, which is only active when AGP >= 9 and
// android.builtInKotlin isn't opted out. Fall back to explicit kotlin-android.
def agpMajor = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0] as int
def builtInKotlin = providers.gradleProperty("android.builtInKotlin")
        .map { it.toBoolean() }
        .orElse(agpMajor >= 9)
        .get()
if (agpMajor < 9 || !builtInKotlin) {
    apply plugin: 'kotlin-android'
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://central.sonatype.com/repository/maven-snapshots/" }
        // com.moengage:tooltip:1.0.0 is only published to the local Maven repo for now.
        mavenLocal()
    }
}


ext {
    moengageNativeBomVersion = "4.0.0"
    moengagePluginBaseBomVersion = "4.0.1-SNAPSHOT"
}

apply plugin: 'com.moengage.android.hybrid.module.config.plugin'

hybridModuleConfig.configurePlugin {
    kotlinOptions {
        enableJvmTarget = true
        compilerArgs = []
    }
}

android {
    compileSdk 36
    namespace "com.moengage.flutter"
    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }
}

dependencies {
    implementation(platform("com.moengage:android-bom:$moengageNativeBomVersion"))
    api("com.moengage:moe-android-sdk")
    api("com.moengage:inapp")

    api(platform("com.moengage:plugin-base-bom:$moengagePluginBaseBomVersion"))
    api("com.moengage:plugin-base")

    // Native tooltip/beacon/spotlight overlays - only available via mavenLocal() for now.
    implementation("com.moengage:tooltip:1.0.0")
    // ViewTreeLifecycleOwner - tooltip's Compose-based beacon/spotlight overlays require this to
    // be set on the decor view; FlutterActivity doesn't set it up itself (see NativeTooltipRenderer).
    implementation("androidx.lifecycle:lifecycle-runtime-android:2.10.0")

    compileOnly("org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version")
}

tasks.register("printLifecycleJar") {
    doLast {
        configurations.debugCompileClasspath.files.each { f ->
            println "CP_FILE: " + f.name
        }
    }
}
