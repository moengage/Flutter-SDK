name: moengage_geofence_android
description: Android implementation of the moengage_geofence plugin
version: 5.0.0
homepage: https://www.moengage.com

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.44.0"

resolution: workspace
flutter:
  plugin:
    implements: moengage_geofence
    platforms:
      android:
        package: com.moengage.flutter.geofence
        pluginClass: MoEngageGeofencePlugin
        dartPluginClass: MoEngageGeofenceAndroid

dependencies:
  flutter:
    sdk: flutter
  moengage_flutter: ^11.0.0
  moengage_geofence_platform_interface: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  plugin_platform_interface: ^2.0.0