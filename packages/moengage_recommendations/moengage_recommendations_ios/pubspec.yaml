name: moengage_recommendations_ios
description: iOS implementation of the moengage_recommendations plugin
version: 1.0.0
homepage: https://www.moengage.com

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.44.0"

resolution: workspace
flutter:
  plugin:
    implements: moengage_recommendations
    platforms:
      ios:
        pluginClass: MoEngageRecommendationsPlugin
        dartPluginClass: MoEngageRecommendationsIOS

dependencies:
  flutter:
    sdk: flutter
  moengage_flutter: ^11.0.0
  moengage_recommendations_platform_interface: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  plugin_platform_interface: ^2.0.0
