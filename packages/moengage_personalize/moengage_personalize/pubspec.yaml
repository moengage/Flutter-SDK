name: moengage_personalize
description: Flutter Plugin for using Personalize Experience feature of MoEngage Platform.
version: 2.0.0
homepage: https://www.moengage.com

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.44.0"

resolution: workspace
dependencies:
  flutter:
    sdk: flutter
  moengage_flutter: ^11.0.0
  moengage_personalize_android: 2.0.0
  moengage_personalize_ios: 2.0.0
  moengage_personalize_platform_interface: 2.0.0

dev_dependencies:
  flutter_lints: ^2.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.0
  plugin_platform_interface: ^2.0.0

flutter:
  plugin:
    platforms:
      android:
        default_package: moengage_personalize_android
      ios:
        default_package: moengage_personalize_ios