pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
        maven { url 'https://developer.huawei.com/repo/' }
    }

    resolutionStrategy {
        eachPlugin {
            // The AGConnect Gradle plugin does not publish a plugin marker artifact,
            // so it can't be resolved by id alone via the plugins {} DSL.
            if (requested.id.id == "com.huawei.agconnect") {
                useModule("com.huawei.agconnect:agcp:1.9.1.302")
            }
        }
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    // Kotlin support is built into AGP as of 9.0, so org.jetbrains.kotlin.android
    // is no longer applied/declared here.
    id "com.android.application" version "9.1.1" apply false
    id "com.google.gms.google-services" version "4.4.2" apply false
    id "com.huawei.agconnect" version "1.9.1.302" apply false
}

include ':app'

dependencyResolutionManagement {
    repositories {
        google()
        mavenCentral()
    }
    versionCatalogs {
        libs {
            create("moengage") {
                from("com.moengage:android-dependency-catalog:6.5.1")
            }
            create("appLibs") {
                from(files("../android/gradle/appLibs.versions.toml"))
            }
        }
    }
}